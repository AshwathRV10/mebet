name: tests

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite
        env:
          # The suite is hermetic: synthetic fixtures and temporary databases,
          # no third-party feed. Offline mode makes that a hard guarantee, so a
          # test that started reaching the network fails loudly here instead of
          # making CI depend on someone else's uptime.
          MEBET_OFFLINE: "true"
        run: pytest

      - name: Check the application starts
        env:
          MEBET_OFFLINE: "true"
        run: |
          mebet init
          python -c "from mebet.api.app import create_app; create_app(); print('api boots')"

  pinned:
    # Separately verify that the exact pinned versions in requirements.txt still
    # install and pass, so the documented reproducible setup cannot rot unnoticed.
    name: pinned requirements (python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Run the test suite
        env:
          MEBET_OFFLINE: "true"
        run: pytest
